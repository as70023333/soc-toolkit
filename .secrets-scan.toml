# secrets-scan: organization rules
#
# These run BEFORE the built-in rules (see soc_toolkit/secrets_scan/default_rules.toml), so
# your own key formats are reported with your own names and severities. Copy this file to the
# root of any repository as .secrets-scan.toml and edit it.
#
# Each rule can carry `examples` (must match) and `not_examples` (must not match);
# `secrets-scan --test-rules` checks them, and CI runs that on every push.
# This file is never scanned itself, so the fake examples below do not trigger findings.

# Built-in rules to switch off, by id (top-level keys must come before the first [[rule]]).
disable = []

# --- keys used by the SOC automation in this portfolio (soc-agent, phish-triage) -------------

[[rule]]
id = "soc-agent-api-key"
description = "Autonomous SOC agent / phishing agent API key (SOC_WEBHOOK_KEY, PHISH_API_KEY)"
regex = '''(?i)\b(?:SOC_WEBHOOK_KEY|PHISH_API_KEY)["']?\s*[:=]\s*["']?([A-Za-z0-9_+/=-]{16,})'''
severity = "high"
keywords = ["soc_webhook_key", "phish_api_key"]
examples = [
  "SOC_WEBHOOK_KEY=k3Yq9vT2mPz8LwX4rB7nC1dF",
  'PHISH_API_KEY: "Tq7uV2wX9yZ3aB6cD8eF0gH1"',
]
not_examples = [
  "SOC_WEBHOOK_KEY=",
  "SOC_WEBHOOK_KEY=${SOC_WEBHOOK_KEY}",
  "Set SOC_WEBHOOK_KEY in .env before starting the agent",
]

[[rule]]
id = "threat-intel-api-key"
description = "Threat-intel feed API key (VirusTotal, AbuseIPDB, OTX, GreyNoise, abuse.ch)"
regex = '''(?i)\b(?:VIRUSTOTAL_API_KEY|ABUSEIPDB_API_KEY|OTX_API_KEY|GREYNOISE_API_KEY|ABUSECH_AUTH_KEY)["']?\s*[:=]\s*["']?([A-Za-z0-9]{24,128})'''
severity = "high"
keywords = ["_api_key", "abusech_auth_key"]
examples = ["VIRUSTOTAL_API_KEY=4f1c2e9a7b3d5f8e0a6c4b2d9e7f1a3c5b8d0e2f4a6c8e1b3d5f7a9c0e2b4d6f"]
not_examples = ["VIRUSTOTAL_API_KEY=your-virustotal-key", "VIRUSTOTAL_API_KEY="]

[[rule]]
id = "azure-client-secret-assignment"
description = "Entra app client secret assigned in configuration (AZURE_CLIENT_SECRET)"
regex = '''(?i)\bAZURE_CLIENT_SECRET["']?\s*[:=]\s*["']?([^\s"'#]{20,})'''
severity = "critical"
keywords = ["azure_client_secret"]
examples = ["AZURE_CLIENT_SECRET=pLm9Kx2Vt7QwE4rZ8yN1bC6dF3gH0jS5aU"]
not_examples = ["AZURE_CLIENT_SECRET=<client secret>", "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}"]

# --- an example internal key format; replace with your organization's ---------------------

[[rule]]
id = "contoso-internal-api-key"
description = "Contoso internal API key (ctso_live_ / ctso_test_ prefix)"
regex = '''\b(ctso_(?:live|test)_[A-Za-z0-9]{32})\b'''
severity = "high"
keywords = ["ctso_"]
examples = ["api_key = 'ctso_live_8fJ2kL9mN3pQ7rS1tU5vW0xY4zA6bC2d'"]
not_examples = ["ctso_live_short", "ctso_prod_8fJ2kL9mN3pQ7rS1tU5vW0xY4zA6bC2d"]

# --- tuning ----------------------------------------------------------------------------------

[allowlist]
# Paths that are never scanned (globs; patterns without "/" match the file name).
paths = ["tests/fixtures/**", "*.lock", "package-lock.json"]
# Regexes: a candidate secret matching one of these is ignored.
regexes = []
# Substrings: a candidate secret containing one of these is ignored.
stopwords = []
